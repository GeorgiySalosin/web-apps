<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Погодная карусель | Прогноз на 7 дней</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="weather-app" id="weatherApp">
        <h1>
            🌤️ Прогноз погоды
            <span class="location-badge" id="locationLabel"> Определяем город...</span>
        </h1>
        <div class="sub" id="subMessage">7 дней в карусели | стрелки для навигации</div>

        <div class="carousel-wrapper">
            <button class="carousel-btn" id="prevBtn" aria-label="Назад">‹</button>
            <div class="carousel-viewport" id="carouselViewport">
                <div class="carousel-items" id="carouselItems">
                    <div class="loader"> Загрузка данных погоды...</div>
                </div>
            </div>
            <button class="carousel-btn" id="nextBtn" aria-label="Вперед">›</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
