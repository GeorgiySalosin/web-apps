<!DOCTYPE html>
<html lang="ru">
    <head>
        <link rel="icon" href="DefaultUser.jpg">
        <link rel="stylesheet" type="text/css" href="1.css">
        <title>ToDo List</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <main>
            <div class="Header">
                <div class="Header-icon"></div>
                <div class="Header-text">
                    <h1>ToDoList</h1>
                </div>
            </div>
            
            <div class="MyInput">
                <input type="text" id="taskInput" placeholder="добавить элемент"/>
                <button id="createButton">Создать</button>
                <button id="clearButton">Очистить</button>
            </div>

            <!-- Список задач -->
            <ol data-placeholder="Не найдено ни одного дела" id="todoList"></ol>

            <!-- Панель фильтрации и сортировки (ПОД списком) -->
            <div class="filter-panel">
                <div class="filter-links">
                    <a href="#" data-filter="all" class="filter-link active">Все</a>
                    <a href="#" data-filter="completed" class="filter-link">Сделано (<span id="completedCount">0</span>)</a>
                    <a href="#" data-filter="active" class="filter-link">Не сделано (<span id="activeCount">0</span>)</a>
                </div>
                <div class="sort-buttons">
                    <button data-sort="date-asc" class="sort-btn">📅 Старые → Новые</button>
                    <button data-sort="date-desc" class="sort-btn active">📅 Новые → Старые</button>
                    <button data-sort="name-asc" class="sort-btn">📝 А → Я</button>
                    <button data-sort="name-desc" class="sort-btn">📝 Я → А</button>
                </div>
            </div>
        </main>

        <footer class="site-footer">
            <hr>
            <p>&copy; 2026 WebSite. All Rights Claimed.</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
